name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run package:win

      - name: Find Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'Voice-Code-Setup-*.exe' | Select-Object -First 1

          if (-not $installer) {
            Write-Host "Contents of dist:"
            Get-ChildItem -Path dist -Recurse
            throw "Windows installer was not found."
          }

          New-Item -ItemType Directory -Force -Path artifact-staging | Out-Null

          Copy-Item `
            $installer.FullName `
            "artifact-staging/Voice-Code-Win.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Code-Win
          path: artifact-staging/Voice-Code-Win.exe
          if-no-files-found: error
