name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Initialize Visual Studio build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Run end-to-end user journey
        run: npm run test:e2e:windows
      - name: Upload end-to-end test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-log
          path: test-results/e2e-journey.log
          if-no-files-found: ignore
      - name: Set package version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Build and publish Windows installer
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}